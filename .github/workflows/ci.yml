name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# The estate-wide half of this file is a CALL, not a copy. The 170 lines it replaces said so
# themselves: "THIS FILE IS TEMPORARY … deleted and replaced by a call to the shared reusable
# workflow". That workflow exists, so this is that deletion.
#
# WHAT THE COPY COST WHILE IT SURVIVED. service-ci.yml runs a step no bespoke file had: it derives
# every scope this service's route gates demand and fails if one is absent from the registry in
# @cloudsforge/contracts-auth. identity refuses to mint a token naming an unknown scope, so an
# unregistered scope is a service-to-service surface no identity-issued token can ever reach — and
# the suite stays green regardless, because it mints its own principals. studio:read and
# studio:write have been gating routes here with nothing checking either.
#
# The shared workflow also brings this repository its first image job of any kind: the bespoke file
# had none, so nothing had ever established that this service's Dockerfile even builds, let alone
# that the image migrates, starts and answers /livez.
#
# CI MUST NEVER SPEND MONEY, and does not: no image credential is supplied, so the three live
# generation tests skip themselves and every other test runs against the fake FLUX server. That is
# a skip the service-ci skip-detector does not catch and should not — it watches for the DATABASE
# suite skipping, which is the skip that would hide this service's spend cap.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: studio
      database-env-var: STUDIO_DATABASE_URL
      # 4015, read off src/env.ts's own default rather than chosen here. The shared workflow checks
      # that .env.example agrees with that default, so all three stay in step.
      port: 4015
      # Match production rather than the workflow's default of 16: the estate's compose files pin
      # postgres:17-alpine, and a suite that passes on a version nobody runs proves nothing.
      postgres-version: '17'
      # The image smoke test boots the real service, and src/env.ts validates its configuration at
      # import — so the container needs the variables it declares, not just a database, or it exits
      # before it can serve /livez. CI-only NON-secrets: the signing secret only has to clear a
      # length check and not be a known placeholder, and the identity URLs are never dialled
      # because /livez needs no upstream.
      #
      # Note what is NOT here: no Foundry API key. The image must boot without one, because a
      # deployment that cannot start without a paid credential cannot be smoke-tested — and a smoke
      # test that spends money is one nobody will run.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=ci-only-not-a-real-secret-000000000000
    secrets:
      # @cloudsforge/* resolves through link:../runtime rather than a registry, so the workflow
      # checks out micro-runtime as a sibling. It is private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  controls:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Rule 7 — migrations are never run by the service process'
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi
          echo 'ok: the service process does not migrate'

      - name: 'Rule 8 — every background timer is a leased job'
        # The shared workflow bans setInterval. This repository bans setTimeout with it: a FLUX call
        # takes 20 to 40 seconds and its deadline belongs to the job, not to a hand-rolled timer.
        # Comment lines are excluded: this repository DISCUSSES the frozen estate's timers, and a
        # check that cannot tell a timer from a sentence about one is a check people learn to
        # ignore.
        run: |
          if grep -rnE '\bset(Interval|Timeout)\(' src/ --include='*.ts' \
             | grep -v '\.test\.ts' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a timer was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi
          echo 'ok: no unmarked timer'

      # The generation must not be able to crawl back inside the request. A FLUX call takes 20 to
      # 40 seconds; doing it in the handler means the money leaves and the record of what it
      # bought does not arrive.
      - name: 'The generate route answers 202 and enqueues'
        run: |
          grep -q 'status: 202' src/server.ts \
            || { echo '::error::the generate route no longer answers 202'; exit 1; }
          echo 'ok: the generate route answers 202'

      # THE TRAP. `model` is required in the request BODY even though the URL path names the model;
      # omitting it is 400 no_model_name. It reads like duplication, which is exactly why somebody
      # will delete it.
      - name: 'The FLUX request body always carries `model`'
        run: |
          grep -q 'model,' src/backend.ts \
            || { echo '::error::bodyFor no longer sends `model` — that is 400 no_model_name'; exit 1; }

      # No secret may be committed. `.env.example` carries placeholders only.
      - name: 'No credential in a committed file'
        run: |
          if grep -rnE '(AZURE_FOUNDRY_API_KEY|OUTBOX_SIGNING_SECRET)=[A-Za-z0-9_-]{16,}' \
             --include='*.example' --include='*.yml' --include='*.ts' --include='*.md' .; then
            echo '::error::a credential appears to be committed'
            exit 1
          fi
          echo 'ok: no credential in a committed file'

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments
      # whatever follows. The pattern matches a continuation line of a block comment (leading `*`)
      # that carries a `*/` with more text after it — the only shape that does damage.
      - name: 'No comment-terminating sequence inside a block comment'
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi
