name: CI

# ────────────────────────────────────────────────────────────────────────────────────────────────
# The estate-wide half of this file is a CALL, not a copy. The 170 lines it replaces said so
# themselves: "THIS FILE IS TEMPORARY … deleted and replaced by a call to the shared reusable
# workflow". That workflow exists, so this is that deletion.
#
# WHAT THE COPY COST WHILE IT SURVIVED. service-ci.yml runs a step no bespoke file had: it derives
# every scope this service's route gates demand and fails if one is absent from the registry in
# @cloudsforge/contracts-auth. identity refuses to mint a token naming an unknown scope, so an
# unregistered scope is a service-to-service surface no identity-issued token can ever reach — and
# the suite stays green regardless, because it mints its own principals. studio:read and
# studio:write have been gating routes here with nothing checking either.
#
# The shared workflow also brings this repository its first image job of any kind: the bespoke file
# had none, so nothing had ever established that this service's Dockerfile even builds, let alone
# that the image migrates, starts and answers /livez.
#
# CI MUST NEVER SPEND MONEY, and does not: no image credential is supplied, so the three live
# generation tests skip themselves and every other test runs against the fake FLUX server. That is
# a skip the service-ci skip-detector does not catch and should not — it watches for the DATABASE
# suite skipping, which is the skip that would hide this service's spend cap.
# ────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  estate:
    uses: cloudsforge-online/micro-org/.github/workflows/service-ci.yml@main
    with:
      service: studio
      database-env-var: STUDIO_DATABASE_URL
      # 4015, read off src/env.ts's own default rather than chosen here. The shared workflow checks
      # that .env.example agrees with that default, so all three stay in step.
      port: 4015
      # Match production rather than the workflow's default of 16: the estate's compose files pin
      # postgres:17-alpine, and a suite that passes on a version nobody runs proves nothing.
      postgres-version: '17'
      # The image smoke test boots the real service, and src/env.ts validates its configuration at
      # import — so the container needs the variables it declares, not just a database, or it exits
      # before it can serve /livez. The identity URLs are CI-only NON-secrets, never dialled
      # because /livez needs no upstream.
      #
      # `OUTBOX_SIGNING_SECRET=@generate` asks service-ci.yml for a fresh `openssl rand -base64 48`
      # per run. It used to be `ci-only-not-a-real-secret-000000000000`, described here as a value
      # that "only has to clear a length check and not be a known placeholder" — and that
      # description was the defect. A value of exactly that shape sat in a PUBLIC compose file,
      # cleared every guard in the estate and was live on 44 containers (micro-org #142). The boot
      # guard now checks SHAPE and has no CI exemption, so CI holds a real generated secret rather
      # than a string claiming to be one.
      #
      # Note what is NOT here: no Foundry API key. The image must boot without one, because a
      # deployment that cannot start without a paid credential cannot be smoke-tested — and a smoke
      # test that spends money is one nobody will run.
      smoke-env: |
        IDENTITY_JWKS_URL=http://127.0.0.1:4001/.well-known/jwks.json
        IDENTITY_ISSUER=http://127.0.0.1:4001
        OUTBOX_SIGNING_SECRET=@generate
        # The smoke test runs the image as uid 1000 against a root-owned WORKDIR, so the default
        # asset root `./out` resolves to `/app/out` and the boot check dies with EACCES — which is
        # the check working. `src/env.ts` refuses to start on a root it cannot write to because an
        # unset root once silently 500'd every generation while reporting healthy.
        #
        # Given here rather than defaulted in the image on purpose: a writable default would send
        # generated assets into a container layer, to be lost on the next redeploy. The deployment
        # is what knows where assets belong, so the deployment is what must say.
        STUDIO_ASSET_ROOT=/tmp/studio-assets
    secrets:
      # @cloudsforge/* resolves through link:../runtime rather than a registry, so the workflow
      # checks out micro-runtime as a sibling. It is private, so it needs a contents:read token.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: read

  controls:
    name: The controls this service exists to add
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 'Rule 7 — migrations are never run by the service process'
        run: |
          if grep -nE '\bmigrate\(' src/index.ts; then
            echo '::error::index.ts calls migrate — that is the migrator job, not the service'
            exit 1
          fi
          echo 'ok: the service process does not migrate'

      - name: 'Rule 8 — every background timer is a leased job'
        # The shared workflow bans setInterval. This repository bans setTimeout with it: a FLUX call
        # takes 20 to 40 seconds and its deadline belongs to the job, not to a hand-rolled timer.
        # Comment lines are excluded: this repository DISCUSSES the frozen estate's timers, and a
        # check that cannot tell a timer from a sentence about one is a check people learn to
        # ignore.
        run: |
          if grep -rnE '\bset(Interval|Timeout)\(' src/ --include='*.ts' \
             | grep -v '\.test\.ts' \
             | grep -vE '^[^:]+:[0-9]+: *(//|\*)'; then
            echo '::error::a timer was found; background work is a leased job (@cloudsforge/jobs)'
            exit 1
          fi
          echo 'ok: no unmarked timer'

      # The generation must not be able to crawl back inside the request. A FLUX call takes 20 to
      # 40 seconds; doing it in the handler means the money leaves and the record of what it
      # bought does not arrive.
      - name: 'The generate route answers 202 and enqueues'
        run: |
          grep -q 'status: 202' src/server.ts \
            || { echo '::error::the generate route no longer answers 202'; exit 1; }
          echo 'ok: the generate route answers 202'

      # THE TRAP. `model` is required in the request BODY even though the URL path names the model;
      # omitting it is 400 no_model_name. It reads like duplication, which is exactly why somebody
      # will delete it.
      - name: 'The FLUX request body always carries `model`'
        run: |
          grep -q 'model,' src/backend.ts \
            || { echo '::error::bodyFor no longer sends `model` — that is 400 no_model_name'; exit 1; }

      # No secret may be committed. `.env.example` carries placeholders only.
      #
      # A PLACEHOLDER MUST SAY IT IS ONE, and one that does is not a finding. This check matched on
      # length alone, so the CI-only value this repository's own workflow used to hand the image
      # smoke test — `OUTBOX_SIGNING_SECRET=ci-only-not-a-real-secret-000000000000` — was reported
      # as a committed credential. The bespoke workflow this replaced never tripped it only because
      # it wrote its environment as YAML `KEY: value` rather than `KEY=value`, which is a difference
      # in punctuation, not in safety.
      #
      # THAT VALUE IS GONE: the smoke test now takes `@generate` and env.ts holds the key to a
      # SHAPE rather than to a length, because a 40-character placeholder cleared every guard in
      # the estate while looking checked (micro-org #142). This step is the second half of the same
      # lesson — it is the reason a real key pasted into `.env.example` would be caught — so it
      # stays, and it stays pointed at `.github/workflows/` too.
      #
      # The allowlist is the SHAPE of a placeholder rather than one spelling of one word, and it is
      # the same vocabulary micro-org's secret-hygiene.yml settled on after five services failed
      # that check on values like CHANGE_ME_TO_32_RANDOM_CHARACTERS. A value that does NOT announce
      # itself as fake is still treated as real, which is the behaviour worth keeping — so
      # `.github/workflows/` is deliberately still in scope. A guard that fails on correct code gets
      # bypassed, and this one stands in front of the failure that cannot be undone.
      - name: 'No credential in a committed file'
        run: |
          set -uo pipefail
          placeholder='(not-a-real|ci-only|change[ _-]?me|replace|placeholder|example|your[ _-]|<[a-z]|todo|xxx)'

          # `|| true` is load-bearing: grep exits 1 when it matches nothing, GitHub runs this block
          # as `bash -e {0}`, and `set -uo pipefail` does not turn `-e` off — so without it a clean
          # repository aborts the step before the `if` is reached, and the check would only ever
          # have been exercised on the repositories that fail it.
          hits=$(grep -rnE '(AZURE_FOUNDRY_API_KEY|OUTBOX_SIGNING_SECRET)=[A-Za-z0-9_-]{16,}' \
                 --include='*.example' --include='*.yml' --include='*.ts' --include='*.md' . || true)

          # THE PLACEHOLDER TEST IS APPLIED TO THE VALUE, NEVER TO THE WHOLE MATCH LINE. Filtering
          # the line would test the PATH as well, and `.env.example` — the single file most likely
          # to hold a pasted credential — contains the word "example", so a real secret in it would
          # have been filtered out as a placeholder by its own filename. That was true of the first
          # version of this step and was caught by running it against a deliberately real-looking
          # value; it is the exact shape of the guards in this estate that passed wrongly for
          # months. Everything up to and including the variable name is stripped first.
          # THE REPORT NAMES THE PLACE AND NEVER THE VALUE. This step used to print the whole
          # matching line, so the one run that found a real committed credential would have copied
          # it into a CI log — a log with a wider audience than the file it came from, and one
          # nobody thinks to rotate. A finding is actionable from `path:line` alone; the truncated
          # SHA-256 is there so two findings can be told apart, and so an operator can confirm a
          # rotation landed by comparing digests rather than by pasting secrets around. It matches
          # how deploy/scripts/check-secret-hygiene.py correlates, for the same reason.
          suspect=''
          while IFS= read -r line; do
            [ -n "$line" ] || continue
            where=$(printf '%s' "$line" | cut -d: -f1,2)
            value=$(printf '%s' "$line" | sed -E 's/.*(AZURE_FOUNDRY_API_KEY|OUTBOX_SIGNING_SECRET)=//')
            # An `if` rather than `cmd && continue`: a trailing `&&` list that fails IS the last
            # command of the statement, so under `bash -e {0}` it would abort the step on the first
            # line that turned out to be a legitimate placeholder — the common case.
            if printf '%s' "$value" | grep -qiE "$placeholder"; then
              continue
            fi
            digest=$(printf '%s' "$value" | sha256sum | cut -c1-12)
            suspect="${suspect}  ${where}  sha256:${digest}…  (${#value} characters)"$'\n'
          done <<< "$hits"

          if [ -n "$suspect" ]; then
            echo '::error::a credential appears to be committed (value withheld deliberately):'
            printf '%s' "$suspect"
            echo 'Open the file at that line. If it is a placeholder, say so IN THE VALUE —'
            echo 'ci-only-…, CHANGE_ME, <your-key>. If it is real, rotate it: it is in git history.'
            exit 1
          fi
          echo 'ok: no credential in a committed file'

      # A `*/` in the MIDDLE of a block comment terminates it early and silently uncomments
      # whatever follows. The pattern matches a continuation line of a block comment (leading `*`)
      # that carries a `*/` with more text after it — the only shape that does damage.
      - name: 'No comment-terminating sequence inside a block comment'
        run: |
          if grep -rnE '^\s*\*.*\*/.+' src/ --include='*.ts'; then
            echo '::error::a */ appears mid-way through a block comment and terminates it early'
            exit 1
          fi

  # ──────────────────────────────────────────────────────────────────────────────────────────────
  # THE IMAGE, PUBLISHED. `cfctl release` writes a manifest naming ghcr.io/cloudsforge-online/<repo>
  # at this repository's package.json version (micro-org tools/cfctl.ts, image name derived
  # at tools/registry.ts); `cfctl release --verify` runs `docker manifest inspect` on every
  # entry (cfctl.ts); and deploy/scripts/release-deploy.sh refuses to change anything
  # until all of them pull. Until this job existed CI built this image and threw it away, so that
  # gate rejected every service in the estate and the manifest path could not be used at all.
  #
  # `packages: write` IS GRANTED HERE rather than asked for inside the shared CI workflow, and that
  # is forced rather than stylistic: a called workflow's GITHUB_TOKEN can only be maintained or
  # reduced, never elevated, so a reusable workflow asking for a permission its caller withheld
  # fails the whole run at STARTUP — before a step runs, on pull requests as well as on main.
  # Measured on micro-org: run 30900277471 (caller capped at `packages: read`) ended in
  # startup_failure; run 30900280323 (same workflow, caller granted `packages: write`) succeeded.
  # That is also why `push: false` is correct and stays in the shared workflow's image job — that
  # job is a GATE and needs `load:` so it can boot the image and read its health endpoint. This is
  # the producer. Different purposes, so different jobs.
  # ──────────────────────────────────────────────────────────────────────────────────────────────
  publish:
    needs: [estate, controls]
    # A green push to main and nothing else. An image tag a release manifest pins has to name
    # something that passed, on the branch it will be deployed from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: cloudsforge-online/micro-org/.github/workflows/publish-image.yml@main
    with:
      kind: service
    secrets:
      # The same sibling checkouts the Dockerfile's named build contexts need: the image cannot be
      # built without micro-runtime and micro-contracts beside it.
      estate_token: ${{ secrets.ESTATE_READ_TOKEN }}
    permissions:
      contents: read
      packages: write
